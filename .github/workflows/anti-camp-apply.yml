name: Apply anti-camp spawn fairness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/anti-camp-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python3 tools/apply_anti_camp.py
      - name: Validate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          s=Path('index.html').read_text();m=re.search(r'<script>([\s\S]*?)</script>',s)
          if not m: raise SystemExit('game script missing')
          Path('/tmp/game.js').write_text(m.group(1));json.loads(Path('manifest.webmanifest').read_text())
          PY
          node --check /tmp/game.js
          node --check sw.js
          node tests/input-regression.mjs
          node tests/spawn-fairness-regression.mjs
          git diff --check
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tests/spawn-fairness-regression.mjs
          git commit -m 'Prevent permanent safe zones in random spawns'
          git pull --rebase origin main
          git push origin main
