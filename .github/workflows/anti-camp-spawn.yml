name: Anti-camp spawn fairness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/anti-camp-spawn.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add coverage-debt and anti-camp spawning
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text()
          if 'SPAWN_ZONE_COUNT=5' in s:
              raise SystemExit('anti-camp spawn logic already exists')

          old='''  function sideCount(type){let n=0;for(const o of obstacles)if(o.type===type)n++;return n}\n  function chooseSeparated(min,max,last,avoid){\n    if(max<=min)return min;let candidate=min+Math.random()*(max-min);\n    for(let i=0;i<6;i++){candidate=min+Math.random()*(max-min);if(Math.abs(candidate-last)>avoid)break}\n    return candidate;\n  }\n  function comboSafePosition(min,max,last,lastAt,avoid){\n    let candidate=chooseSeparated(min,max,last,avoid);\n    if(last<-900||lastAt<0)return candidate;\n    const gap=Math.max(0,elapsed-lastAt),span=Math.max(1,max-min);\n    if(gap<.52){\n      const t=clamp(gap/.52,0,1),maxShift=span*(.34+.30*t);\n      candidate=clamp(candidate,last-maxShift,last+maxShift);\n    }\n    return candidate;\n  }'''
          new='''  const SPAWN_ZONE_COUNT=5,MAX_ZONE_DEBT=8,CAMP_THRESHOLD=1.6,CAMP_RAMP=1.4,CAMP_MAX_BONUS=1.2;\n  const spawnCoverage={left:Array(SPAWN_ZONE_COUNT).fill(0),right:Array(SPAWN_ZONE_COUNT).fill(0)},campBias={left:{zone:-1,time:0},right:{zone:-1,time:0}};\n  function resetSpawnBias(){for(const type of ['left','right']){spawnCoverage[type].fill(0);campBias[type].zone=-1;campBias[type].time=0}}\n  function zoneIndexFor(pos,min,max){if(max<=min)return Math.floor(SPAWN_ZONE_COUNT/2);return clamp(Math.floor((pos-min)/(max-min)*SPAWN_ZONE_COUNT),0,SPAWN_ZONE_COUNT-1)}\n  function playerSpawnZone(type){if(type==='left'){const [min,max]=horizontalBounds(0);return zoneIndexFor(leftP.x,min,max)}const [min,max]=roleYBounds(rightP);return zoneIndexFor(rightP.y,min,max)}\n  function updateCampBias(dt){\n    for(const type of ['left','right']){\n      const camp=campBias[type],zone=playerSpawnZone(type),edge=zone===0||zone===SPAWN_ZONE_COUNT-1;\n      if(edge){if(camp.zone===zone)camp.time=Math.min(CAMP_THRESHOLD+CAMP_RAMP,camp.time+dt);else{camp.zone=zone;camp.time=dt}}\n      else{camp.time=Math.max(0,camp.time-dt*1.5);if(camp.time===0)camp.zone=-1}\n    }\n  }\n  function spawnZoneWeights(type){\n    const weights=spawnCoverage[type].map(debt=>1+Math.min(MAX_ZONE_DEBT,debt)*.12),camp=campBias[type];\n    if((camp.zone===0||camp.zone===SPAWN_ZONE_COUNT-1)&&camp.time>CAMP_THRESHOLD){const t=clamp((camp.time-CAMP_THRESHOLD)/CAMP_RAMP,0,1);weights[camp.zone]+=CAMP_MAX_BONUS*t}\n    return weights;\n  }\n  function pickWeightedZone(weights){let total=0;for(const w of weights)total+=w;let roll=Math.random()*total;for(let i=0;i<weights.length;i++){roll-=weights[i];if(roll<=0)return i}return weights.length-1}\n  function markSpawnCoverage(type,pos,min,max){const hit=zoneIndexFor(pos,min,max),debt=spawnCoverage[type];for(let i=0;i<debt.length;i++)debt[i]=i===hit?0:Math.min(MAX_ZONE_DEBT,debt[i]+1)}\n  function sideCount(type){let n=0;for(const o of obstacles)if(o.type===type)n++;return n}\n  function chooseSeparated(min,max,last,avoid){\n    if(max<=min)return min;let candidate=min+Math.random()*(max-min);\n    for(let i=0;i<6;i++){candidate=min+Math.random()*(max-min);if(Math.abs(candidate-last)>avoid)break}\n    return candidate;\n  }\n  function weightedZoneCandidate(type,min,max,last,avoid){\n    if(max<=min)return min;const zone=pickWeightedZone(spawnZoneWeights(type)),span=(max-min)/SPAWN_ZONE_COUNT,zMin=min+span*zone,zMax=zone===SPAWN_ZONE_COUNT-1?max:min+span*(zone+1);return chooseSeparated(zMin,zMax,last,avoid);\n  }\n  function comboSafePosition(type,min,max,last,lastAt,avoid){\n    let candidate=weightedZoneCandidate(type,min,max,last,avoid);\n    if(last>=-900&&lastAt>=0){\n      const gap=Math.max(0,elapsed-lastAt),span=Math.max(1,max-min);\n      if(gap<.52){const t=clamp(gap/.52,0,1),maxShift=span*(.34+.30*t);candidate=clamp(candidate,last-maxShift,last+maxShift)}\n    }\n    markSpawnCoverage(type,candidate,min,max);return candidate;\n  }'''
          if old not in s:
              raise SystemExit('spawn helper anchor not found')
          s=s.replace(old,new,1)

          old_reset='setModePositions();lastLeftSpawn=-999;lastRightSpawn=-999;lastLeftSpawnAt=-1;lastRightSpawnAt=-1;'
          new_reset='setModePositions();resetSpawnBias();lastLeftSpawn=-999;lastRightSpawn=-999;lastLeftSpawnAt=-1;lastRightSpawnAt=-1;'
          if old_reset not in s: raise SystemExit('reset anchor not found')
          s=s.replace(old_reset,new_reset,1)

          old_left='x=comboSafePosition(minX,maxX,lastLeftSpawn,lastLeftSpawnAt,Math.max(42,size*1.8))'
          old_right='y=comboSafePosition(minY,maxY,lastRightSpawn,lastRightSpawnAt,Math.max(42,size*1.8))'
          if old_left not in s or old_right not in s: raise SystemExit('spawn call anchor missing')
          s=s.replace(old_left,'x=comboSafePosition(type,minX,maxX,lastLeftSpawn,lastLeftSpawnAt,Math.max(42,size*1.8))',1)
          s=s.replace(old_right,'y=comboSafePosition(type,minY,maxY,lastRightSpawn,lastRightSpawnAt,Math.max(42,size*1.8))',1)

          old_update="elapsed+=dt;scoreEl.textContent=elapsed.toFixed(1);"
          if old_update not in s: raise SystemExit('update anchor not found')
          s=s.replace(old_update,"elapsed+=dt;updateCampBias(dt);scoreEl.textContent=elapsed.toFixed(1);",1)
          p.write_text(s)
          PY

          cat > tests/spawn-fairness-regression.mjs <<'EOF'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';

          const source=fs.readFileSync(new URL('../index.html',import.meta.url),'utf8');
          for(const needle of [
            'SPAWN_ZONE_COUNT=5',
            'CAMP_THRESHOLD=1.6',
            'CAMP_MAX_BONUS=1.2',
            'updateCampBias(dt)',
            'weightedZoneCandidate(type,min,max,last,avoid)',
            'markSpawnCoverage(type,candidate,min,max)',
            'comboSafePosition(type,minX,maxX',
            'comboSafePosition(type,minY,maxY',
            'const spawnGap=()=>Math.max(.29,.86-difficultyElapsed()*.0105);',
            'if(gap<.52)'
          ]) assert.ok(source.includes(needle),`missing source guard: ${needle}`);

          const ZONES=5,MAX_DEBT=8,THRESHOLD=1.6,RAMP=1.4,MAX_BONUS=1.2;
          function weights(debt,campZone=-1,campTime=0){
            const out=debt.map(d=>1+Math.min(MAX_DEBT,d)*.12);
            if((campZone===0||campZone===ZONES-1)&&campTime>THRESHOLD){const t=Math.max(0,Math.min(1,(campTime-THRESHOLD)/RAMP));out[campZone]+=MAX_BONUS*t}
            return out;
          }
          const probability=(ws,i)=>ws[i]/ws.reduce((a,b)=>a+b,0);
          assert.equal(probability(weights([0,0,0,0,0]),0),.2,'fresh zones must stay uniformly random');
          const starved=probability(weights([6,0,0,0,0]),0);
          assert.ok(starved>.29&&starved<.32,`coverage debt should gently raise probability, got ${starved}`);
          const campFresh=probability(weights([0,0,0,0,0],0,3),0);
          assert.ok(campFresh>.35&&campFresh<.37,`edge camping should be biased but not targeted, got ${campFresh}`);
          assert.equal(probability(weights([0,0,0,0,0],2,3),2),.2,'center zones must not receive anti-camp targeting');
          const worst=probability(weights([8,0,0,0,0],0,3),0);
          assert.ok(worst<.55,`single-zone probability must remain capped below 55%, got ${worst}`);
          const debt=[8,6,4,2,1],hit=0;
          const next=debt.map((d,i)=>i===hit?0:Math.min(MAX_DEBT,d+1));
          assert.deepEqual(next,[0,7,5,3,2],'actual hit zone should reset while other zones accumulate debt');
          console.log('spawn fairness regression checks passed');
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/input-regression.yml')
          s=p.read_text()
          if "tests/spawn-fairness-regression.mjs" not in s:
              s=s.replace("      - 'tests/input-regression.mjs'\n", "      - 'tests/input-regression.mjs'\n      - 'tests/spawn-fairness-regression.mjs'\n")
              s=s.replace("        run: node tests/input-regression.mjs", "        run: |\n          node tests/input-regression.mjs\n          node tests/spawn-fairness-regression.mjs")
          p.write_text(s)
          PY
      - name: Validate scripts and fairness invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          s=Path('index.html').read_text()
          m=re.search(r'<script>([\s\S]*?)</script>',s)
          if not m: raise SystemExit('game script missing')
          Path('/tmp/game.js').write_text(m.group(1))
          json.loads(Path('manifest.webmanifest').read_text())
          PY
          node --check /tmp/game.js
          node --check sw.js
          node tests/input-regression.mjs
          node tests/spawn-fairness-regression.mjs
          git diff --check
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tests/spawn-fairness-regression.mjs .github/workflows/input-regression.yml
          git commit -m 'Prevent permanent safe zones in random spawns'
          git pull --rebase origin main
          git push origin main
