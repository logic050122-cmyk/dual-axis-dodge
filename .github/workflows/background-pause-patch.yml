name: Apply background auto-pause

on:
  push:
    paths:
      - '.github/workflows/background-pause-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python tools/patch_background_pause.py
      - name: Validate game JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          Path('/tmp/game.js').write_text(s.split('<script>',1)[1].split('</script>',1)[0],encoding='utf-8')
          PY
          node --check /tmp/game.js
      - name: Validate PWA files
        run: |
          python -m json.tool manifest.webmanifest >/dev/null
          node --check sw.js
      - name: Assert background pause logic
        run: |
          grep -q "state==='running'||state==='countdown'" index.html
          grep -q "state='paused'" index.html
          grep -q "++countdownToken" index.html
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Auto-pause when game enters background'
          git push origin HEAD:main
