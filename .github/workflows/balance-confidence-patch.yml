name: Apply balance confidence upgrade

on:
  push:
    paths:
      - '.github/workflows/balance-confidence-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python tools/patch_balance_confidence.py
      - name: Validate game JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          Path('/tmp/game.js').write_text(s.split('<script>',1)[1].split('</script>',1)[0],encoding='utf-8')
          PY
          node --check /tmp/game.js
      - name: Validate balance confidence logic
        shell: bash
        run: |
          grep -q "minRuns=12" index.html
          grep -q "minPerAxis=5" index.html
          grep -q "TREND EVEN" index.html
          grep -q "SAMPLE \${balance.runs}/\${balance.minRuns}" index.html
          grep -q "balanceReady:recentBalance().ready" index.html
          python - <<'PY'
          def classify(runs,h,v,ha,va):
              ready=runs>=12 and h>=5 and v>=5
              trend='collecting'
              if ready:
                  gap=abs(ha-va); base=max(1,(ha+va)/2); meaningful=gap>=2 and gap/base>=.15
                  trend=('horizontal' if ha<va else 'vertical') if meaningful else 'even'
              return ready,trend
          assert classify(8,4,4,12,20)==(False,'collecting')
          assert classify(12,6,6,20,21)==(True,'even')
          assert classify(12,6,6,14,20)==(True,'horizontal')
          assert classify(14,7,7,24,17)==(True,'vertical')
          assert classify(20,4,16,10,30)==(False,'collecting')
          PY
      - name: Validate PWA files
        run: |
          node --check sw.js
          python -m json.tool manifest.webmanifest >/dev/null
      - name: Commit upgrade
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add sample confidence to balance telemetry'
          git push origin HEAD:main
