name: Repair swap and mobile audio

on:
  push:
    paths:
      - '.github/workflows/fix-swap-mobile-audio.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch gameplay and audio
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          def replace_exact(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              s = s.replace(old, new, 1)

          replace_exact(
              "function syncControlState(){const canPause=state==='running'||state==='paused';pauseBtn.disabled=!canPause;pauseBtn.textContent=state==='paused'?'▶':'Ⅱ';pauseBtn.setAttribute('aria-label',state==='paused'?'继续':'暂停');swapBtn.disabled=!(state==='idle'||state==='over')}",
              "function syncControlState(){const canPause=state==='running'||state==='paused';pauseBtn.disabled=!canPause;pauseBtn.textContent=state==='paused'?'▶':'Ⅱ';pauseBtn.setAttribute('aria-label',state==='paused'?'继续':'暂停');swapBtn.disabled=false}",
              'swap button state'
          )

          replace_exact(
              "function setSwap(next){if(state!=='idle'&&state!=='over')return false;next=!!next;if(swapped===next){syncSideUI();return true}swapped=next;storage.set('dualAxisSwapped',swapped?'on':'off');obstacles=[];setModePositions();syncSideUI();syncControlState();draw();vibrate(15);playTick(swapped?720:560,.055,.035);return true}\n  function toggleSwap(){setSwap(!swapped)}",
              "function mirrorLayout(next){const delta=next?split:-split;leftP.x+=delta;leftP.targetX+=delta;for(const o of obstacles){if(o.type==='left')o.x+=delta;else o.x-=delta}refreshFixedTracks();const [hx0,hx1]=horizontalBounds();leftP.x=clamp(leftP.x,hx0,hx1);leftP.targetX=clamp(leftP.targetX,hx0,hx1);rightP.targetY=clamp(rightP.targetY,64+rightP.r,H-rightP.r-18)}\n  function setSwap(next){if(state!=='idle'&&state!=='over'&&state!=='paused')return false;next=!!next;if(swapped===next){syncSideUI();return true}swapped=next;storage.set('dualAxisSwapped',swapped?'on':'off');if(state==='paused'){clearPointers();mirrorLayout(next);lastTime=performance.now()}else{obstacles=[];setModePositions()}syncSideUI();syncControlState();draw();vibrate(15);playTick(swapped?720:560,.055,.035);return true}\n  function toggleSwap(){if(state==='running'||state==='countdown')interruptGame();setSwap(!swapped)}",
              'runtime swap logic'
          )

          replace_exact(
              "左右模式只在开局/结算切换，避免暂停时把已有障碍翻到另一侧。",
              "右下 ⇄ 可互换左右半屏；游戏中点击会先安全暂停，现有障碍会同步镜像到另一半屏。",
              'pause swap note'
          )

          replace_exact(
              "swapBtn.setAttribute('aria-pressed',String(swapped));swapBtn.title=swapped?'当前：左纵向 / 右横向':'当前：左横向 / 右纵向';syncSetupUI();",
              "swapBtn.setAttribute('aria-pressed',String(swapped));swapBtn.title=(swapped?'当前：左纵向 / 右横向':'当前：左横向 / 右纵向')+' · 点击互换（游戏中会暂停）';syncSetupUI();",
              'swap title'
          )

          replace_exact(
              "if(document.hidden){\n      if(!interruptGame())releaseWakeLock();\n    }else if(state==='running'||state==='countdown')acquireWakeLock();",
              "if(document.hidden){\n      if(!interruptGame())releaseWakeLock();\n    }else{if(state==='running'||state==='countdown')acquireWakeLock();if(audioOn)ensureAudio()}",
              'visibility audio recovery'
          )

          replace_exact(
              "let audioCtx=null,master=null,compressor=null,audioOn=storage.get('dualAxisAudio','on')!=='off',musicTimer=null,musicStep=0;\n  audioBtn.textContent=audioOn?'♫':'×';\n  function ensureAudio(){\n    if(!audioOn)return;const AudioCtor=window.AudioContext||window.webkitAudioContext;if(!AudioCtor){audioOn=false;audioBtn.textContent='×';return}\n    try{if(!audioCtx){audioCtx=new AudioCtor();master=audioCtx.createGain();compressor=audioCtx.createDynamicsCompressor();master.gain.value=.55;compressor.threshold.value=-18;compressor.knee.value=12;compressor.ratio.value=4;compressor.attack.value=.003;compressor.release.value=.2;master.connect(compressor);compressor.connect(audioCtx.destination);startMusic()}if(audioCtx.state==='suspended'){const p=audioCtx.resume();if(p&&typeof p.catch==='function')p.catch(()=>{})}}catch{audioOn=false;audioBtn.textContent='×'}\n  }",
              "let audioCtx=null,master=null,compressor=null,audioOn=storage.get('dualAxisAudio','on')!=='off',musicTimer=null,musicStep=0;\n  function syncAudioButton(){audioBtn.textContent=audioOn?'♫':'×';audioBtn.setAttribute('aria-pressed',String(audioOn));audioBtn.title=audioOn?'音乐开启':'音乐关闭'}\n  syncAudioButton();\n  function ensureAudio(){\n    if(!audioOn)return Promise.resolve(false);const AudioCtor=window.AudioContext||window.webkitAudioContext;if(!AudioCtor){audioOn=false;syncAudioButton();return Promise.resolve(false)}\n    try{if(!audioCtx){audioCtx=new AudioCtor();master=audioCtx.createGain();compressor=audioCtx.createDynamicsCompressor();master.gain.value=.72;compressor.threshold.value=-18;compressor.knee.value=12;compressor.ratio.value=4;compressor.attack.value=.003;compressor.release.value=.2;master.connect(compressor);compressor.connect(audioCtx.destination);startMusic()}if(audioCtx.state==='running')return Promise.resolve(true);const p=audioCtx.resume();return Promise.resolve(p).then(()=>audioCtx.state==='running').catch(()=>false)}catch{return Promise.resolve(false)}\n  }",
              'audio init'
          )

          replace_exact(
              "function startMusic(){if(musicTimer)clearInterval(musicTimer);const notes=[110,165,220,165,123.47,185,246.94,185];musicTimer=setInterval(()=>{if(!audioOn||!audioCtx||document.hidden)return;const base=notes[musicStep%notes.length];playTone(base,.21,.055,'triangle');if(musicStep%2===0)playTone(base*2,.075,.028,'square',.01);if(state==='running'&&elapsed>20&&musicStep%4===2)playTone(base*3,.06,.02,'sine',.04);musicStep++},250)}\n  audioBtn.addEventListener('click',e=>{e.stopPropagation();audioOn=!audioOn;storage.set('dualAxisAudio',audioOn?'on':'off');audioBtn.textContent=audioOn?'♫':'×';if(audioOn)ensureAudio();else if(audioCtx&&audioCtx.state==='running'){const p=audioCtx.suspend();if(p&&typeof p.catch==='function')p.catch(()=>{})}});",
              "function startMusic(){if(musicTimer)clearInterval(musicTimer);const notes=[220,330,440,330,246.94,369.99,493.88,369.99];musicTimer=setInterval(()=>{if(!audioOn||!audioCtx||audioCtx.state!=='running'||document.hidden)return;const base=notes[musicStep%notes.length];playTone(base,.21,.072,'triangle');if(musicStep%2===0)playTone(base*2,.075,.032,'square',.01);if(state==='running'&&elapsed>20&&musicStep%4===2)playTone(base*1.5,.07,.026,'sine',.04);musicStep++},250)}\n  const unlockAudio=()=>{if(audioOn)ensureAudio()};document.addEventListener('pointerdown',unlockAudio,{capture:true,passive:true});document.addEventListener('touchstart',unlockAudio,{capture:true,passive:true});\n  audioBtn.addEventListener('click',e=>{e.stopPropagation();audioOn=!audioOn;storage.set('dualAxisAudio',audioOn?'on':'off');syncAudioButton();if(audioOn)ensureAudio().then(ok=>{if(ok)playTick(880,.055,.05)});else if(audioCtx&&audioCtx.state==='running'){const p=audioCtx.suspend();if(p&&typeof p.catch==='function')p.catch(()=>{})}});",
              'mobile audible music'
          )

          replace_exact(
              "audioAvailable:!!(window.AudioContext||window.webkitAudioContext),playable:playable(),standalone:",
              "audioAvailable:!!(window.AudioContext||window.webkitAudioContext),audioOn,audioState:audioCtx?.state||'none',musicActive:!!musicTimer,playable:playable(),standalone:",
              'health audio diagnostics'
          )

          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          sws = sw.read_text(encoding='utf-8')
          if "const CACHE = 'dual-axis-dodge-v1';" in sws:
              sws = sws.replace("const CACHE = 'dual-axis-dodge-v1';", "const CACHE = 'dual-axis-dodge-v2';", 1)
          elif "const CACHE = 'dual-axis-dodge-v2';" not in sws:
              raise SystemExit('unexpected service worker cache version')
          sw.write_text(sws, encoding='utf-8')
      - name: Validate JavaScript and invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          js=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S).group(1)
          Path('/tmp/game.js').write_text(js,encoding='utf-8')
          required=[
            "if(state==='running'||state==='countdown')interruptGame();setSwap(!swapped)",
            "if(state==='paused'){clearPointers();mirrorLayout(next);lastTime=performance.now()}",
            "const notes=[220,330,440,330,246.94,369.99,493.88,369.99]",
            "document.addEventListener('pointerdown',unlockAudio",
            "audioState:audioCtx?.state||'none'",
          ]
          for item in required:
            assert item in s, item
          # Verify mirroring is reversible for both obstacle families.
          split=500
          left_x=180
          down_x=240
          across_x=690
          left_x += split; down_x += split; across_x -= split
          assert (left_x,down_x,across_x)==(680,740,190)
          left_x -= split; down_x -= split; across_x += split
          assert (left_x,down_x,across_x)==(180,240,690)
          print('structural and mirror checks passed')
          PY
          node --check /tmp/game.js
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'Fix runtime side swap and mobile music'
          git push origin HEAD:main
