name: Fix swapped vertical position

on:
  push:
    paths:
      - '.github/workflows/fix-swapped-vertical-position.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch swapped vertical placement
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="function verticalRoleX(){const pad=rightP.r+18,local=split*verticalTrackX;return swapped?clamp(local,pad,split-pad):clamp(split+local,split+pad,W-pad)}"
          new="function verticalRoleX(){const pad=rightP.r+18,offset=split*verticalTrackX;return swapped?clamp(split-offset,pad,split-pad):clamp(split+offset,split+pad,W-pad)}"
          if s.count(old)!=1:
              raise SystemExit(f'verticalRoleX expected 1 match, got {s.count(old)}')
          s=s.replace(old,new,1)
          old_note='位置会自动记住。横位百分比按当前角色所在半屏、从障碍进入方向计算。'
          new_note='位置会自动记住。纵向角色按“离中线距离”设置，左右互换时保持镜像对称。'
          if s.count(old_note)==1:
              s=s.replace(old_note,new_note,1)
          p.write_text(s,encoding='utf-8')
      - name: Validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          js=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S).group(1)
          Path('/tmp/game.js').write_text(js,encoding='utf-8')
          assert "return swapped?clamp(split-offset,pad,split-pad):clamp(split+offset,split+pad,W-pad)" in s
          split=500; ratio=.76
          normal=split+split*ratio
          swapped=split-split*ratio
          assert normal==880 and swapped==120
          assert abs((normal+swapped)-1000)<1e-9
          print('swapped vertical placement mirror check passed:', normal, swapped)
          PY
          node --check /tmp/game.js
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Mirror vertical control position when sides swap'
          git push origin HEAD:main
