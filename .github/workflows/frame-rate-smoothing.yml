name: Frame-rate independent player smoothing

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/frame-rate-smoothing.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch player follow smoothing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = "  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));\n"
          new = old + "  const FOLLOW_RATE=27.4,followAlpha=dt=>1-Math.exp(-FOLLOW_RATE*dt);\n"
          if 'const FOLLOW_RATE=27.4' not in s:
              if old not in s:
                  raise SystemExit('clamp anchor not found')
              s = s.replace(old, new, 1)
          old_move = "    const nextLX=prevLX+(leftP.targetX-prevLX)*Math.min(1,dt*22),nextRY=prevRY+(rightP.targetY-prevRY)*Math.min(1,dt*22);"
          new_move = "    const follow=followAlpha(dt),nextLX=prevLX+(leftP.targetX-prevLX)*follow,nextRY=prevRY+(rightP.targetY-prevRY)*follow;"
          if old_move not in s and new_move not in s:
              raise SystemExit('movement anchor not found')
          s = s.replace(old_move, new_move, 1)
          p.write_text(s)
          PY
      - name: Validate JavaScript and frame-rate invariance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          start=s.index('<script>')+len('<script>')
          end=s.index('</script>',start)
          Path('/tmp/game.js').write_text(s[start:end])
          assert 'Math.min(1,dt*22)' not in s
          assert 'followAlpha=dt=>1-Math.exp(-FOLLOW_RATE*dt)' in s
          PY
          node --check /tmp/game.js
          node - <<'JS'
          const rate=27.4;
          const alpha=dt=>1-Math.exp(-rate*dt);
          const remaining=(fps,seconds=0.5)=>{
            const dt=1/fps; let x=0;
            for(let i=0;i<Math.round(fps*seconds);i++) x += (1-x)*alpha(dt);
            return 1-x;
          };
          const vals=[30,60,90,120,144].map(fps=>[fps,remaining(fps)]);
          const ref=vals[1][1];
          for(const [fps,v] of vals){
            if(Math.abs(v-ref)>1e-12) throw new Error(`frame-rate drift at ${fps}Hz: ${v} vs ${ref}`);
          }
          const old60=22/60;
          const new60=alpha(1/60);
          if(Math.abs(new60-old60)>0.01) throw new Error(`60Hz feel changed too much: ${new60} vs ${old60}`);
          console.log({new60,old60,vals});
          JS
          node --check sw.js
          python3 -m json.tool manifest.webmanifest >/dev/null
      - name: Commit tested change
        run: |
          if git diff --quiet -- index.html; then
            echo 'No change needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Make player smoothing frame-rate independent'
          git push origin main
