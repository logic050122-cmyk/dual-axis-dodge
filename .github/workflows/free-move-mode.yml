name: Add free movement mode

on:
  push:
    paths:
      - '.github/workflows/free-move-mode.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
      - name: Patch game
        run: python3 .github/free_move_patch.py
      - name: Validate JavaScript
        run: node --check /tmp/game.js
      - name: Validate timing and mirror math
        run: |
          python3 -c "rates=(30,60,90,120,144); speed=900.0; values=[sum(speed*(1/hz) for _ in range(hz)) for hz in rates]; assert max(values)-min(values)<1e-9, values; print(dict(zip(rates,values)))"
          python3 -c "W=1456.0; xs=(40,175,590,866,1200,1410); assert all(abs((W-(W-x))-x)<1e-9 for x in xs); print('mirror reversible')"
      - name: Commit tested mode
        run: |
          rm -f .github/workflows/free-move-mode.yml .github/free_move_patch.py
          git config user.name 'logic050122-cmyk'
          git config user.email 'logic050122@gmail.com'
          git add -A
          git commit -m 'Add axis-lock and free movement modes'
          git push origin HEAD:main
