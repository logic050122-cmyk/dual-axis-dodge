name: Input regression

on:
  push:
    paths:
      - 'index.html'
      - 'arcade-games.js'
      - 'arcade-games.css'
      - 'games/dual-axis-dodge/**'
      - 'sw.js'
      - 'tests/**'
      - '.github/workflows/input-regression.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'arcade-games.js'
      - 'arcade-games.css'
      - 'games/dual-axis-dodge/**'
      - 'sw.js'
      - 'tests/**'
      - '.github/workflows/input-regression.yml'

permissions:
  contents: read

jobs:
  gameplay-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run input and spawn fairness regression checks
        run: |
          node tests/input-regression.mjs
          node tests/spawn-fairness-regression.mjs
          node tests/touch-ownership-regression.mjs
          node tests/lifecycle-audio-regression.mjs
          node tests/resource-races-regression.mjs
          node tests/sw-cache-regression.mjs
          node tests/near-miss-feedback-regression.mjs
          node tests/obstacle-trails-regression.mjs
          node tests/dart-obstacles-regression.mjs
          node tests/arcade-regression.mjs
          node tests/sequence-memory-regression.mjs
          node tests/extra-games-regression.mjs
          node tests/lobby-regression.mjs
          node tests/line-game-regression.mjs
          node tests/pulse-game-regression.mjs
          node tests/sort-game-regression.mjs
          node tests/maze-game-regression.mjs
