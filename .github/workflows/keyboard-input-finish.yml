name: Keyboard input timing finish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keyboard-input-finish.yml'

permissions:
  contents: write

jobs:
  finish-keyboard-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch keyboard timing edges
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old_loop = "function loop(now){const dt=Math.min(.033,Math.max(0,(now-lastTime)/1000));lastTime=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);"
          new_loop = "function loop(now){const dt=Math.min(.05,Math.max(0,(now-lastTime)/1000));lastTime=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);"
          old_key = "window.addEventListener('keydown',e=>{if(!keyboardCodes.has(e.code))return;if(state==='running'||state==='countdown')e.preventDefault();keyboardHeld.add(e.code)},{passive:false});"
          new_key = "window.addEventListener('keydown',e=>{if(!keyboardCodes.has(e.code))return;if(state!=='running'&&state!=='countdown')return;e.preventDefault();keyboardHeld.add(e.code)},{passive:false});"
          assert old_loop in s, 'expected dt clamp implementation not found'
          assert old_key in s, 'expected keyboard handler not found'
          s = s.replace(old_loop, new_loop, 1).replace(old_key, new_key, 1)
          p.write_text(s)
          PY
      - name: Syntax check inline JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s = Path('index.html').read_text()
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, flags=re.S|re.I)
          assert scripts, 'no inline script found'
          Path('/tmp/dual-axis.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/dual-axis.js
      - name: Verify keyboard timing invariants
        run: |
          node <<'JS'
          const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
          const speed=1000;
          for(const hz of [30,60,90,120,144]){
            let x=0;
            for(let i=0;i<hz;i++){
              const dt=Math.min(.05,1/hz);
              x+=speed*dt;
            }
            if(Math.abs(x-speed)>1e-9) throw new Error(`${hz}Hz displacement ${x}`);
          }
          const held=new Set();
          const axis=(negA,negB,posA,posB)=>(held.has(posA)||held.has(posB)?1:0)-(held.has(negA)||held.has(negB)?1:0);
          held.add('KeyA'); if(axis('KeyA','ArrowLeft','KeyD','ArrowRight')!==-1) throw new Error('A axis');
          held.add('KeyD'); if(axis('KeyA','ArrowLeft','KeyD','ArrowRight')!==0) throw new Error('opposites must cancel');
          held.clear(); held.add('KeyD'); held.add('KeyW');
          if(axis('KeyA','ArrowLeft','KeyD','ArrowRight')!==1||axis('KeyW','ArrowUp','KeyS','ArrowDown')!==-1) throw new Error('simultaneous axes');
          held.delete('KeyD'); if(axis('KeyA','ArrowLeft','KeyD','ArrowRight')!==0) throw new Error('keyup');
          held.clear(); if(held.size!==0) throw new Error('clear');
          console.log('30/60/90/120/144Hz displacement and keyboard axis invariants: PASS');
          JS
      - name: Commit verified fix
        run: |
          if git diff --quiet -- index.html; then
            echo 'No patch needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Finish frame-rate independent keyboard controls'
          git push
