name: Keyboard input integration

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch_keyboard_input.py'
      - '.github/workflows/keyboard-input-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply keyboard patch
        run: python tools/patch_keyboard_input.py
      - name: Validate game JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',text,re.S)
          assert scripts
          Path('/tmp/game.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/game.js
      - name: Validate keyboard invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          required=[
            "const keyboardHeld=new Set()",
            "keyboardAxis('KeyA','ArrowLeft','KeyD','ArrowRight')",
            "keyboardAxis('KeyW','ArrowUp','KeyS','ArrowDown')",
            "window.addEventListener('keyup'",
            "window.addEventListener('blur',()=>keyboardHeld.clear()",
            "keyboardHorizontalSpeed=()=>clamp((split-60)/.55,650,1400)",
            "keyboardVerticalSpeed=()=>clamp((H-100)/.55,520,1100)",
            "keyboardHeld:[...keyboardHeld]"
          ]
          for item in required:
            assert item in s, item
          assert "const step=35" not in s
          assert "e.key==='a'" not in s
          PY
          node --check sw.js
          python -m json.tool manifest.webmanifest >/dev/null
      - name: Commit upgrade
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Make desktop keyboard controls continuous and responsive'
          git push origin main
