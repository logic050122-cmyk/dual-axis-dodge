name: Apply local balance telemetry

on:
  push:
    paths:
      - '.github/workflows/local-telemetry-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply telemetry patch
        run: python tools/patch_local_telemetry.py
      - name: Validate game JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          Path('/tmp/game.js').write_text(s.split('<script>',1)[1].split('</script>',1)[0],encoding='utf-8')
          PY
          node --check /tmp/game.js
      - name: Validate telemetry invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          required=["function recordRun(cause)","recentRuns=recentRuns.slice(-30)","gameOver(o.type)","axis:cause==='left'?'horizontal':'vertical'","recentBalance:recentBalance()"]
          for item in required:
              assert item in s, item
          assert "gameOver()" not in s
          print('telemetry invariants ok')
          PY
      - name: Validate PWA files
        run: |
          node --check sw.js
          python -m json.tool manifest.webmanifest >/dev/null
      - name: Commit upgrade
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Track local death-axis balance data'
          git push origin HEAD:main
# trigger integration
