name: Apply orientation pause safety

on:
  push:
    paths:
      - 'tools/patch_orientation_pause.py'
      - '.github/workflows/orientation-pause-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python tools/patch_orientation_pause.py
      - name: Validate game JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          Path('/tmp/game.js').write_text(s.split('<script>',1)[1].split('</script>',1)[0],encoding='utf-8')
          PY
          node --check /tmp/game.js
      - name: Validate orientation safeguards
        shell: bash
        run: |
          grep -q "if(!playable())interruptGame()" index.html
          grep -q "function interruptGame()" index.html
          ! grep -q "state==='idle'||state==='countdown'||state==='over'" index.html
      - name: Validate PWA files
        shell: bash
        run: |
          node --check sw.js
          python -m json.tool manifest.webmanifest >/dev/null
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Pause safely on portrait rotation'
          git push origin HEAD:main
