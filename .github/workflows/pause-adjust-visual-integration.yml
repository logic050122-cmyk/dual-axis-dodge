name: Pause adjustment visualization integration

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch_pause_adjust_visual.py'
      - '.github/workflows/pause-adjust-visual-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply pause adjustment patch
        run: python3 tools/patch_pause_adjust_visual.py
      - name: Validate game JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script>(.*?)</script>', text, flags=re.S)
          assert blocks, 'inline script missing'
          Path('/tmp/game.js').write_text(blocks[-1], encoding='utf-8')
          PY
          node --check /tmp/game.js
      - name: Validate pause adjustment invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          checks=[
            "state!=='idle'&&state!=='over'&&state!=='paused'",
            "if(state==='paused')refreshFixedTracks();else setModePositions()",
            "pauseHorizontalYInput",
            "pauseVerticalXInput",
            "drawAdjustmentPreview",
            "pauseOverlay.classList.toggle('adjusting',state==='paused')",
            "adjustingKind",
          ]
          for c in checks:
            assert c in text, c
          assert text.count('id="pauseHorizontalYInput"') == 1
          assert text.count('id="pauseVerticalXInput"') == 1
          PY
          node --check sw.js
          python3 -m json.tool manifest.webmanifest >/dev/null
      - name: Commit upgrade
        run: |
          if git diff --quiet -- index.html; then
            echo 'No game change produced' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Allow visible position tuning while paused'
          git push origin main
