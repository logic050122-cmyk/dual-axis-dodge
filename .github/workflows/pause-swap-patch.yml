name: Apply pause and side swap

on:
  push:
    paths:
      - '.github/workflows/pause-swap-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python tools/patch_pause_swap.py
      - name: Validate game JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/game.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/game.js
      - name: Validate PWA files
        shell: bash
        run: |
          python -m json.tool manifest.webmanifest >/dev/null
          node --check sw.js
      - name: Commit upgrade
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add pause and swappable control sides'
          git push origin HEAD:main
