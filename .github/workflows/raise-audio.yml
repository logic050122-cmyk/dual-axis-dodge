name: Raise game audio

on:
  push:
    paths:
      - '.github/workflows/raise-audio.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch audio levels safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          reps = [
              ("let audioCtx=null,master=null,audioOn=storage.get('dualAxisAudio','on')!=='off',musicTimer=null,musicStep=0;", "let audioCtx=null,master=null,compressor=null,audioOn=storage.get('dualAxisAudio','on')!=='off',musicTimer=null,musicStep=0;"),
              ("try{if(!audioCtx){audioCtx=new AudioCtor();master=audioCtx.createGain();master.gain.value=.12;master.connect(audioCtx.destination);startMusic()}", "try{if(!audioCtx){audioCtx=new AudioCtor();master=audioCtx.createGain();compressor=audioCtx.createDynamicsCompressor();master.gain.value=.55;compressor.threshold.value=-18;compressor.knee.value=12;compressor.ratio.value=4;compressor.attack.value=.003;compressor.release.value=.2;master.connect(compressor);compressor.connect(audioCtx.destination);startMusic()}"),
              ("playTick(520+i*130,.055,.028)", "playTick(520+i*130,.055,.045)"),
              ("playTick(1040,.08,.035)", "playTick(1040,.08,.055)"),
              ("playTick(880,.035,.025)", "playTick(880,.035,.045)"),
              ("function playCrash(){for(let i=0;i<6;i++)playTone(150-i*14,.16,.08,'sawtooth',i*.025)}", "function playCrash(){for(let i=0;i<6;i++)playTone(150-i*14,.18,.11,'sawtooth',i*.025)}"),
              ("playTone(base,.19,.035,'triangle');if(musicStep%2===0)playTone(base*2,.065,.018,'square',.01);if(state==='running'&&elapsed>20&&musicStep%4===2)playTone(base*3,.05,.012,'sine',.04)", "playTone(base,.21,.055,'triangle');if(musicStep%2===0)playTone(base*2,.075,.028,'square',.01);if(state==='running'&&elapsed>20&&musicStep%4===2)playTone(base*3,.06,.02,'sine',.04)"),
          ]
          for old, new in reps:
              if old not in s:
                  raise SystemExit(f'Expected audio pattern not found: {old[:80]}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          node --check <(python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          print(s.split('<script>',1)[1].split('</script>',1)[0])
          PY
          )
      - name: Commit audio patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Raise game audio volume [audio-patch]'
          git push origin HEAD:main
