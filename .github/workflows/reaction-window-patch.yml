name: Apply reaction-window balance

on:
  push:
    paths:
      - '.github/workflows/reaction-window-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply balance patch
        run: python tools/patch_reaction_window.py
      - name: Validate game JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          Path('/tmp/game.js').write_text(s.split('<script>',1)[1].split('</script>',1)[0],encoding='utf-8')
          PY
          node --check /tmp/game.js
      - name: Validate reaction-window math
        shell: bash
        run: |
          python - <<'PY'
          def rw(t): return max(.42,.62-t*.0025)
          for t in (0,10,30,60,120,300):
              v=rw(t)
              assert .419 <= v <= .621
          assert abs(rw(0)-.62)<1e-9
          assert abs(rw(80)-.42)<1e-9
          assert abs(rw(300)-.42)<1e-9
          # Any speed capped as distance/reactionWindow guarantees travel time >= reactionWindow.
          for distance in (120,180,260,360,520):
              for t in (0,30,80,180):
                  cap=distance/rw(t)
                  assert distance/cap + 1e-9 >= rw(t)
          print('reaction-window invariants OK')
          PY
      - name: Validate PWA files
        shell: bash
        run: |
          node --check sw.js
          python -m json.tool manifest.webmanifest >/dev/null
      - name: Commit balance improvement
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Guarantee a minimum obstacle reaction window'
          git push origin HEAD:main
