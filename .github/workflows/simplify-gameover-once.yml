name: Simplify game over once

on:
  push:
    paths:
      - '.github/workflows/simplify-gameover-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Simplify game over summary and document change
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text()
          old_head = "if(state!=='running')return;state='over';clearPointers();releaseWakeLock();syncControlState();const score=elapsed,oldBest=bestForLevel(),run=recordRun(cause),balance=recentBalance();"
          new_head = "if(state!=='running')return;state='over';clearPointers();releaseWakeLock();syncControlState();const score=elapsed,oldBest=bestForLevel(),run=recordRun(cause);"
          if old_head not in text:
              raise SystemExit('gameOver head fragment not found')
          text = text.replace(old_head, new_head, 1)

          old_summary = "finalScoreEl.textContent=score.toFixed(1);const bestName=freeMove?(startLevel===1?'FREE BEST':`FREE L${startLevel} BEST`):(startLevel===1?'PERSONAL BEST':`LEVEL ${startLevel} BEST`);recordText.textContent=score>oldBest?`NEW ${bestName} ${levelBest.toFixed(1)} s`:`${bestName} ${levelBest.toFixed(1)} s`;const avgH=balance.horizontalAvg===null?'—':balance.horizontalAvg.toFixed(1),avgV=balance.verticalAvg===null?'—':balance.verticalAvg.toFixed(1),balanceStatus=balance.ready?(balance.trend==='even'?'TREND EVEN':`TREND ${balance.trend==='horizontal'?'H':'V'} HARDER`):`SAMPLE ${balance.runs}/${balance.minRuns} · NEED H${Math.max(0,balance.minPerAxis-balance.horizontal)} V${Math.max(0,balance.minPerAxis-balance.vertical)}`;sessionText.textContent=`HIT ${run.axis.toUpperCase()} · START L${startLevel} → LEVEL ${lastStage} · NEAR MISS ${nearMisses} · LAST ${balance.runs}: H ${balance.horizontal} / V ${balance.vertical} · AVG H ${avgH}s / V ${avgV}s · ${balanceStatus}`;"
          new_summary = "finalScoreEl.textContent=score.toFixed(1);const bestName=freeMove?(startLevel===1?'FREE BEST':`FREE L${startLevel} BEST`):(startLevel===1?'PERSONAL BEST':`LEVEL ${startLevel} BEST`);recordText.textContent=score>oldBest?`NEW ${bestName} ${levelBest.toFixed(1)} s`:`${bestName} ${levelBest.toFixed(1)} s`;const hitLabel=run.axis==='horizontal'?'HORIZONTAL':'VERTICAL';sessionText.textContent=`HIT ${hitLabel} · LEVEL ${lastStage} · NEAR MISS ${nearMisses}`;"
          if old_summary not in text:
              raise SystemExit('gameOver summary fragment not found')
          index.write_text(text.replace(old_summary, new_summary, 1))

          log = Path('PROJECT_LOG.md')
          log_text = log.read_text()
          marker = '## 7. 更新记录\n'
          if marker not in log_text:
              raise SystemExit('log marker not found')
          entry = '''\n### 2026-09-02 22:16 (Asia/Shanghai) — 精简 Game Over 结算信息\n\n- 目标：项目定位保持为轻量小游戏，结算页应突出“坚持多久”和立即重开，而不是展示一长串历史分析数据。\n- 判断：当前 Game Over 把最近局数、横/纵向死亡次数、平均死亡时间、样本门槛和趋势全部塞进一行，信息密度过高，与简单小游戏定位不匹配；这些历史数据对维护诊断仍有价值，不应删除底层记录。\n- 改动：仅调整 `index.html` 的 `gameOver()` 可见摘要，保留最终成绩、个人/档位最佳、撞击轴、到达 LEVEL 和 NEAR MISS；不再把最近样本、H/V 次数、平均时间和趋势显示给玩家。`recordRun()`、`recentBalance()`、`layoutBalance()` 与 `window.__dualAxisHealth` 仍保留，因此本地历史数据和诊断能力不丢失。\n- 行为约束：不修改移动、障碍、难度、碰撞、双指 ownership、键盘、左右镜像、经典/自由模式、成绩计算、音频、PWA 或本地历史数据格式。\n- 测试：提交前运行现有四套 Node 回归：键盘输入、刷怪公平性、双指 ownership、生命周期/音频/countdown race；并检查 `index.html` 中不再引用 `balance` 变量生成 Game Over 文案。\n- Commit：本条日志与功能同一提交 — `Simplify game over summary`。\n- CI / Pages：提交时 pending；完成后核对 Input regression、Project log guard 与 GitHub Pages。\n- 遗留风险：本轮只减信息，不改变逻辑；唯一需要真机确认的是小屏横屏下精简后的结算视觉间距是否仍自然。\n- 下一步：小游戏定位下不主动扩玩法；后续只处理真实 bug、明显手感问题或用户明确提出的体验问题。\n'''
          log.write_text(log_text.replace(marker, marker + entry, 1))
          PY

          node tests/input-regression.mjs
          node tests/spawn-fairness-regression.mjs
          node tests/touch-ownership-regression.mjs
          node tests/lifecycle-audio-regression.mjs

          rm .github/workflows/simplify-gameover-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html PROJECT_LOG.md .github/workflows/simplify-gameover-once.yml
          git commit -m 'Simplify game over summary'
          git push
