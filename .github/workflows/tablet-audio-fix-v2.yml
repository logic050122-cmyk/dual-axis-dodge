name: Tablet audio compatibility fix v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tablet-audio-fix-v2.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch iPad and tablet Web Audio handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('index.html')
          s=p.read_text()
          old_visibility="    }else{if(state==='running'||state==='countdown')acquireWakeLock();if(audioOn)ensureAudio()}"
          new_visibility="    }else{if(state==='running'||state==='countdown')acquireWakeLock();if(audioOn)recoverAudio()}"
          if old_visibility not in s: raise SystemExit('visibility audio hook not found')
          s=s.replace(old_visibility,new_visibility,1)
          start=s.index("  let audioCtx=null,master=null,compressor=null,audioOn=storage.get('dualAxisAudio','on')!=='off',musicTimer=null,musicStep=0;")
          end=s.index("\n\n  fullscreenBtn.addEventListener",start)
          encoded=''
          new_audio=base64.b64decode(encoded).decode()
          s=s[:start]+new_audio+s[end:]
          old_health="audioAvailable:!!(window.AudioContext||window.webkitAudioContext),audioOn,audioState:audioCtx?.state||'none',musicActive:!!musicTimer"
          new_health="audioAvailable:!!(window.AudioContext||window.webkitAudioContext),audioOn,audioState:audioState(),audioPrimed,audioSessionType:navigator.audioSession?.type||'unavailable',musicActive:!!musicTimer"
          if old_health not in s: raise SystemExit('health audio fields not found')
          s=s.replace(old_health,new_health,1)
          p.write_text(s)
          PY
      - name: Validate game and compatibility hooks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json
          s=Path('index.html').read_text()
          checks={
            'playback_session':"navigator.audioSession.type='playback'" in s,
            'gesture_prime':'function primeAudioOutput()' in s and 'createBufferSource()' in s,
            'resume_recovery':"if(audioCtx.state!=='running')await audioCtx.resume()" in s,
            'pageshow_recovery':"window.addEventListener('pageshow',recoverAudio" in s,
            'focus_recovery':"window.addEventListener('focus',recoverAudio" in s,
            'no_stale_tones':"audioCtx.state!=='running')return" in s,
            'health':'audioSessionType:navigator.audioSession?.type' in s and 'audioPrimed' in s,
            'repair_button':"if(audioOn&&audioState()!=='running')" in s,
          }
          print(json.dumps(checks,indent=2))
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('failed checks: '+', '.join(bad))
          m=re.search(r'<script>\s*\(\(\)=>\{(.*)\}\)\(\);\s*</script>',s,re.S)
          if not m: raise SystemExit('game script not found')
          Path('/tmp/game.js').write_text('(()=>{'+m.group(1)+'})();')
          PY
          node --check /tmp/game.js
          node --check sw.js
          python -m json.tool manifest.webmanifest >/dev/null
      - name: Commit tested fix
        shell: bash
        run: |
          if git diff --quiet -- index.html; then echo 'No index change produced'; exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Harden tablet and iPad audio playback'
          git push origin HEAD:main
