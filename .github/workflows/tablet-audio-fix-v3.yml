name: Tablet audio recovery fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tablet-audio-fix-v3.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch tablet audio handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          def rep(old,new,label):
              global s
              if old not in s: raise SystemExit(label+' not found')
              s=s.replace(old,new,1)
          rep("    }else{if(state==='running'||state==='countdown')acquireWakeLock();if(audioOn)ensureAudio()}","    }else{if(state==='running'||state==='countdown')acquireWakeLock();if(audioOn)recoverAudio()}",'visibility hook')
          rep("  let audioCtx=null,master=null,compressor=null,audioOn=storage.get('dualAxisAudio','on')!=='off',musicTimer=null,musicStep=0;",'''  let audioCtx=null,master=null,compressor=null,audioOn=storage.get('dualAxisAudio','on')!=='off',musicTimer=null,musicStep=0,audioPrimed=false;
          function setPlaybackAudioSession(){try{if(navigator.audioSession&&'type' in navigator.audioSession&&navigator.audioSession.type!=='playback')navigator.audioSession.type='playback'}catch{}}
          function primeAudioOutput(){if(!audioCtx||audioCtx.state==='closed')return false;try{const rate=Math.max(22050,audioCtx.sampleRate||44100),buffer=audioCtx.createBuffer(1,1,rate),source=audioCtx.createBufferSource();source.buffer=buffer;source.connect(master||audioCtx.destination);source.start(0);audioPrimed=true;return true}catch{return false}}
          function recoverAudio(){if(!audioOn)return;setPlaybackAudioSession();ensureAudio(false)}''','audio state')
          rep("  function syncAudioButton(){audioBtn.textContent=audioOn?'♫':'×';audioBtn.setAttribute('aria-pressed',String(audioOn));audioBtn.title=audioOn?'音乐开启':'音乐关闭'}",'''  function syncAudioButton(){const ready=audioOn&&audioCtx?.state==='running';audioBtn.textContent=audioOn?(ready?'♫':'♪'):'×';audioBtn.setAttribute('aria-pressed',String(audioOn));audioBtn.setAttribute('aria-label',audioOn?(ready?'关闭音乐':'启用音乐声音'):'开启音乐');audioBtn.title=audioOn?(ready?'音乐已开启':'音乐待激活 · 点一下或触摸游戏区域'):'音乐关闭'}''','audio button sync')
          a=s.index("  function ensureAudio(){")
          b=s.index("\n  function playTone",a)
          new_ensure='''  function ensureAudio(fromGesture=false){
            if(!audioOn)return Promise.resolve(false);const AudioCtor=window.AudioContext||window.webkitAudioContext;if(!AudioCtor){audioOn=false;syncAudioButton();return Promise.resolve(false)}
            setPlaybackAudioSession();
            try{if(!audioCtx||audioCtx.state==='closed'){audioPrimed=false;try{audioCtx=new AudioCtor({latencyHint:'interactive'})}catch{audioCtx=new AudioCtor()}master=audioCtx.createGain();compressor=audioCtx.createDynamicsCompressor();master.gain.value=.78;compressor.threshold.value=-18;compressor.knee.value=12;compressor.ratio.value=4;compressor.attack.value=.003;compressor.release.value=.2;master.connect(compressor);compressor.connect(audioCtx.destination);audioCtx.addEventListener?.('statechange',syncAudioButton);startMusic()}if(audioCtx.state==='running'){if(fromGesture)primeAudioOutput();syncAudioButton();return Promise.resolve(true)}const p=audioCtx.resume();return Promise.resolve(p).then(()=>{if(fromGesture)primeAudioOutput();syncAudioButton();return audioCtx.state==='running'}).catch(()=>{syncAudioButton();return false})}catch{syncAudioButton();return Promise.resolve(false)}
          }'''
          s=s[:a]+new_ensure+s[b:]
          rep("audioCtx.state==='closed')return","audioCtx.state!=='running')return",'tone state guard')
          rep("  const unlockAudio=()=>{if(audioOn)ensureAudio()};","  const unlockAudio=()=>{if(audioOn)ensureAudio(true)};",'gesture unlock')
          touch="  document.addEventListener('touchstart',unlockAudio,{capture:true,passive:true});"
          rep(touch,touch+"\n  window.addEventListener('pageshow',recoverAudio,{passive:true});\n  window.addEventListener('focus',recoverAudio,{passive:true});",'touch unlock hook')
          a=s.index("  audioBtn.addEventListener('click',e=>")
          b=s.index("\n\n  fullscreenBtn.addEventListener",a)
          audio_click='''  audioBtn.addEventListener('click',e=>{e.stopPropagation();if(audioOn&&audioCtx?.state!=='running'){ensureAudio(true).then(ok=>{if(ok)playTick(880,.055,.05);syncAudioButton()});return}audioOn=!audioOn;storage.set('dualAxisAudio',audioOn?'on':'off');syncAudioButton();if(audioOn)ensureAudio(true).then(ok=>{if(ok)playTick(880,.055,.05)});else if(audioCtx&&audioCtx.state==='running'){const p=audioCtx.suspend();if(p&&typeof p.catch==='function')p.catch(()=>{})}});'''
          s=s[:a]+audio_click+s[b:]
          rep("audioAvailable:!!(window.AudioContext||window.webkitAudioContext),audioOn,audioState:audioCtx?.state||'none',musicActive:!!musicTimer","audioAvailable:!!(window.AudioContext||window.webkitAudioContext),audioOn,audioState:audioCtx?.state||'none',audioPrimed,audioSessionType:navigator.audioSession?.type||'unavailable',musicActive:!!musicTimer",'audio health')
          p.write_text(s)
          PY
      - name: Validate game and compatibility hooks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          s=Path('index.html').read_text()
          checks={
            'playback_session':"navigator.audioSession.type='playback'" in s,
            'gesture_prime':'primeAudioOutput()' in s and 'createBufferSource()' in s,
            'resume_recovery':'audioCtx.resume()' in s and "audioCtx.state==='running'" in s,
            'pageshow_recovery':"window.addEventListener('pageshow',recoverAudio" in s,
            'focus_recovery':"window.addEventListener('focus',recoverAudio" in s,
            'no_stale_tones':"audioCtx.state!=='running')return" in s,
            'repair_button':"if(audioOn&&audioCtx?.state!=='running')" in s,
            'audio_health':'audioSessionType:navigator.audioSession?.type' in s and 'audioPrimed' in s,
          }
          print(json.dumps(checks,indent=2))
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('failed checks: '+', '.join(bad))
          if '<script>' not in s or '</script>' not in s: raise SystemExit('script tags missing')
          Path('/tmp/game.js').write_text(s.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/game.js
          node --check sw.js
          python -m json.tool manifest.webmanifest >/dev/null
      - name: Commit tested fix
        shell: bash
        run: |
          if git diff --quiet -- index.html; then echo 'No index change produced'; exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Harden tablet and iPad audio playback'
          git push origin HEAD:main
