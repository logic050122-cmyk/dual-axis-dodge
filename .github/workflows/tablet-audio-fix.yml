name: Tablet audio compatibility fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tablet-audio-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch iPad and tablet Web Audio handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old_visibility = "    }else{if(state==='running'||state==='countdown')acquireWakeLock();if(audioOn)ensureAudio()}"
          new_visibility = "    }else{if(state==='running'||state==='countdown')acquireWakeLock();if(audioOn)recoverAudio()}"
          if old_visibility not in s:
              raise SystemExit('visibility audio hook not found')
          s = s.replace(old_visibility, new_visibility, 1)

          start = s.index("  let audioCtx=null,master=null,compressor=null,audioOn=storage.get('dualAxisAudio','on')!=='off',musicTimer=null,musicStep=0;")
          end = s.index("\n\n  fullscreenBtn.addEventListener", start)
          new_audio = r'''  let audioCtx=null,master=null,compressor=null,audioOn=storage.get('dualAxisAudio','on')!=='off',musicTimer=null,musicStep=0,audioPrimed=false;
  function setPlaybackAudioSession(){
    try{if(navigator.audioSession&&'type' in navigator.audioSession&&navigator.audioSession.type!=='playback')navigator.audioSession.type='playback'}catch{}
  }
  function audioState(){return audioCtx?.state||'none'}
  function syncAudioButton(){
    const ready=audioOn&&audioState()==='running';
    audioBtn.textContent=audioOn?(ready?'♫':'♪'):'×';
    audioBtn.setAttribute('aria-pressed',String(audioOn));
    audioBtn.setAttribute('aria-label',audioOn?(ready?'关闭音乐':'启用音乐声音'):'开启音乐');
    audioBtn.title=audioOn?(ready?'音乐已开启':'音乐待激活 · 点一下或触摸游戏区域'):'音乐关闭';
  }
  syncAudioButton();
  function buildAudioContext(){
    const AudioCtor=window.AudioContext||window.webkitAudioContext;
    if(!AudioCtor)return false;
    setPlaybackAudioSession();
    try{audioCtx=new AudioCtor({latencyHint:'interactive'})}catch{try{audioCtx=new AudioCtor()}catch{return false}}
    try{
      master=audioCtx.createGain();compressor=audioCtx.createDynamicsCompressor();master.gain.value=.78;
      compressor.threshold.value=-18;compressor.knee.value=12;compressor.ratio.value=4;compressor.attack.value=.003;compressor.release.value=.2;
      master.connect(compressor);compressor.connect(audioCtx.destination);
      audioCtx.addEventListener?.('statechange',syncAudioButton);
      startMusic();return true;
    }catch{audioCtx=null;master=null;compressor=null;return false}
  }
  function primeAudioOutput(){
    if(!audioCtx||audioCtx.state==='closed')return false;
    try{
      const rate=Math.max(22050,audioCtx.sampleRate||44100),buffer=audioCtx.createBuffer(1,1,rate),source=audioCtx.createBufferSource();
      source.buffer=buffer;source.connect(master||audioCtx.destination);source.start(0);audioPrimed=true;return true;
    }catch{return false}
  }
  async function ensureAudio(fromGesture=false){
    if(!audioOn)return false;
    const AudioCtor=window.AudioContext||window.webkitAudioContext;
    if(!AudioCtor){audioOn=false;syncAudioButton();return false}
    setPlaybackAudioSession();
    if(!audioCtx||audioCtx.state==='closed'){audioPrimed=false;if(!buildAudioContext()){syncAudioButton();return false}}
    try{
      if(audioCtx.state!=='running')await audioCtx.resume();
      if(fromGesture)primeAudioOutput();
      const ready=audioCtx.state==='running';syncAudioButton();return ready;
    }catch{syncAudioButton();return false}
  }
  function recoverAudio(){
    if(!audioOn)return;
    setPlaybackAudioSession();
    ensureAudio(false).then(ok=>{if(ok&&!musicTimer)startMusic()});
  }
  function playTone(freq,dur=.12,vol=.05,type='sine',delay=0){if(!audioOn||!audioCtx||!master||audioCtx.state!=='running')return;try{const t=audioCtx.currentTime+delay,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.03)}catch{}}
  const playTick=(freq=660,dur=.04,vol=.03)=>playTone(freq,dur,vol,'square');
  function playCrash(){for(let i=0;i<6;i++)playTone(150-i*14,.18,.11,'sawtooth',i*.025)}
  function startMusic(){if(musicTimer)clearInterval(musicTimer);const notes=[220,330,440,330,246.94,369.99,493.88,369.99];musicTimer=setInterval(()=>{if(!audioOn||!audioCtx||audioCtx.state!=='running'||document.hidden)return;const base=notes[musicStep%notes.length];playTone(base,.21,.072,'triangle');if(musicStep%2===0)playTone(base*2,.075,.032,'square',.01);if(state==='running'&&elapsed>20&&musicStep%4===2)playTone(base*1.5,.07,.026,'sine',.04);musicStep++},250)}
  const unlockAudio=()=>{if(audioOn)ensureAudio(true)};
  document.addEventListener('pointerdown',unlockAudio,{capture:true,passive:true});
  document.addEventListener('touchstart',unlockAudio,{capture:true,passive:true});
  document.addEventListener('keydown',unlockAudio,{capture:true,passive:true});
  window.addEventListener('pageshow',recoverAudio,{passive:true});
  window.addEventListener('focus',recoverAudio,{passive:true});
  audioBtn.addEventListener('click',e=>{
    e.stopPropagation();
    if(audioOn&&audioState()!=='running'){
      ensureAudio(true).then(ok=>{if(ok)playTick(880,.055,.05);syncAudioButton()});
      return;
    }
    audioOn=!audioOn;storage.set('dualAxisAudio',audioOn?'on':'off');syncAudioButton();
    if(audioOn)ensureAudio(true).then(ok=>{if(ok)playTick(880,.055,.05)});
    else if(audioCtx&&audioCtx.state==='running'){const p=audioCtx.suspend();if(p&&typeof p.catch==='function')p.catch(()=>{})}
  });'''
          s = s[:start] + new_audio + s[end:]

          old_health = "audioAvailable:!!(window.AudioContext||window.webkitAudioContext),audioOn,audioState:audioCtx?.state||'none',musicActive:!!musicTimer"
          new_health = "audioAvailable:!!(window.AudioContext||window.webkitAudioContext),audioOn,audioState:audioState(),audioPrimed,audioSessionType:navigator.audioSession?.type||'unavailable',musicActive:!!musicTimer"
          if old_health not in s:
              raise SystemExit('health audio fields not found')
          s = s.replace(old_health, new_health, 1)
          p.write_text(s)
          PY
      - name: Validate game and audio compatibility hooks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json
          s=Path('index.html').read_text()
          checks={
            'playback audio session': "navigator.audioSession.type='playback'" in s,
            'gesture priming': 'function primeAudioOutput()' in s and 'createBufferSource()' in s,
            'interrupted/suspended recovery': "if(audioCtx.state!=='running')await audioCtx.resume()" in s,
            'pageshow recovery': "window.addEventListener('pageshow',recoverAudio" in s,
            'focus recovery': "window.addEventListener('focus',recoverAudio" in s,
            'no queued tones while suspended': "audioCtx.state!=='running')return" in s,
            'audio health telemetry': 'audioSessionType:navigator.audioSession?.type' in s and 'audioPrimed' in s,
            'user repair button': "if(audioOn&&audioState()!=='running')" in s,
          }
          bad=[k for k,v in checks.items() if not v]
          print(json.dumps(checks,ensure_ascii=False,indent=2))
          if bad: raise SystemExit('failed checks: '+', '.join(bad))
          m=re.search(r'<script>\s*\(\(\)=>\{(.*)\}\)\(\);\s*</script>',s,re.S)
          if not m: raise SystemExit('game script not found')
          Path('/tmp/game.js').write_text('(()=>{'+m.group(1)+'})();')
          PY
          node --check /tmp/game.js
          node --check sw.js
          python -m json.tool manifest.webmanifest >/dev/null
      - name: Commit tested fix
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index change produced'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Harden tablet and iPad audio playback'
          git push origin HEAD:main
