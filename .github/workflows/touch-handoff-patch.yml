name: Apply touch handoff

on:
  push:
    paths:
      - 'tools/patch_touch_handoff.py'
      - '.github/workflows/touch-handoff-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python tools/patch_touch_handoff.py
      - name: Validate game JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/game.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/game.js
      - name: Validate handoff invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks=[
            'pointerCandidates=new Map()',
            'pointerPositions=new Map()',
            'function promotePointer(side)',
            'pointerCandidates.has(e.pointerId)',
            'pointerCandidates.has(t.identifier)',
            'touchCandidates:pointerCandidates.size'
          ]
          missing=[x for x in checks if x not in s]
          assert not missing, missing
          assert 'claimPointer(' not in s
          assert 'pointerCandidates.clear()' in s and 'pointerPositions.clear()' in s
          print('handoff invariants ok')
          PY
      - name: Validate PWA files
        run: |
          node --check sw.js
          python -m json.tool manifest.webmanifest >/dev/null
      - name: Commit upgrade
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add seamless touch-owner handoff'
          git push
