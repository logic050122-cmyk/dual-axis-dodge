name: Touch ownership integration
on:
  push:
    paths:
      - tools/patch_touch_ownership.py
      - .github/workflows/touch-ownership-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply touch patch
        run: python tools/patch_touch_ownership.py
      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/game.js').write_text(js)
          PY
          node --check /tmp/game.js
      - name: Validate touch ownership invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=[
            "const sideOwners={left:null,right:null}",
            "function clearPointers(){activePointers.clear();sideOwners.left=null;sideOwners.right=null}",
            "function claimPointer(id,side){if(sideOwners[side]!==null)return false",
            "if(!claimPointer(e.pointerId,side))return",
            "if(claimPointer(t.identifier,side))applyPointer(side,p)",
            "leftPointerOwned:sideOwners.left!==null",
            "rightPointerOwned:sideOwners.right!==null"
          ]
          for item in required:
            assert item in s, item
          assert "leftP.targetX=clamp(p.x,minX,maxX)" in s
          assert "activePointers.set(e.pointerId,side);" not in s
          PY
      - name: Validate PWA files
        run: |
          node --check sw.js
          python -m json.tool manifest.webmanifest >/dev/null
      - name: Commit upgrade
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Harden dual-touch ownership"
          git push
